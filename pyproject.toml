[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsystem-editor"
version = "0.1.0"
description = "Open editor/librarian for the TC Electronic G-System"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "python-rtmidi>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gsystem-tool = "gsystem.cli:main"

[project.gui-scripts]
gsystem-editor = "gsystem.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
